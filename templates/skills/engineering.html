<!DOCTYPE html>
<html>
<head>
    <title>Engineering Skills</title>
</head>

<body>

    <h1>Engineering</h1>
    <h2>Which skills do you already know?</h2>

    <h3>Programming</h3>

    <form action="/skills" method="POST">
        <div>
            <input type="checkbox" name="skills" value="python" id="python">
            <label for="python">Python</label>
        </div>
        
        <div>
            <input type="checkbox" name="skills" value="c" id="c">
            <label for="c">C</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="cpp" id="cpp">
            <label for="cpp">C++</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="java" id="java">
            <label for="java">Java</label>
        </div>

        <h3>Web Development</h3>

        <div>
            <input type="checkbox" name="skills" value="html" id="html">
            <label for="html">HTML</label>
        </div>
        
        <div>
            <input type="checkbox" name="skills" value="css" id="css">
            <label for="css">CSS</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="javascript" id="javascript">
            <label for="javascript">JavaScript</label>
        </div>

        <h3>Data & AI/ML</h3>


        <div>
            <input type="checkbox" name="skills" value="sql" id="sql">
            <label for="sql">SQL</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="numpy" id="numpy">
            <label for="numpy">NumPy</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="pandas" id="pandas">
        <label for="pandas">Pandas</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="statistics" id="statistics">
            <label for="statistics">Statistics</label>
        </div>
        
        <div>
            <input type="checkbox" name="skills" value="machine-learning" id="machine-learning">
            <label for="machine-learning">Machine Learning</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="deep-learning" id="deep-learning">
            <label for="deep-learning">Deep Learning</label>
        </div>

        <h3>Tools</h3>

        <div>
            <input type="checkbox" name="skills" value="git" id="git">
            <label for="git">Git</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="github" id="github">
            <label for="github">GitHub</label>
        </div>

        <div>
            <input type="checkbox" name="skills" value="docker" id="docker">
            <label for="docker">Docker</label>
        </div>

        <button type="submit">Continue</button>
    </form>

</body>
</html>
